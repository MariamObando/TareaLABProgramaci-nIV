<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 — Datos simples, objetos y arreglos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Datos personales</h1>
        <p>Manejo de cadenas, objetos y arreglos con localStorage.</p>
    </header>

    <main>
        <form id="formulario" autocomplete="off">
            <ul class="campos">
                <li>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Su nombre">
                </li>
                <li>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" min="0" max="120" placeholder="Su edad">
                </li>
            </ul>

            <div class="botones">
                <button type="button" id="btn-anadir">Añadir</button>
                <button type="button" id="btn-obtener">Obtener</button>     <!-- ✅ NUEVO -->
                <button type="button" id="btn-complejo">Guardar dato complejo</button>
                <button type="button" id="btn-restaurar-complejo">Restaurar dato complejo</button>
                <button type="button" id="btn-arreglo">Guardar arreglo</button>
                <button type="button" id="btn-restaurar-arreglo">Restaurar arreglo</button>
                <button type="button" id="btn-remover">Remover</button>
                <button type="button" id="btn-limpiar">Limpiar</button>
            </div>
        </form>

        <section id="panel" class="panel">
            <h2>Datos guardados en el localStorage</h2>
            <div id="salida" class="salida">
                <p>Sin datos todavía.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Tema 4 · Laboratorio 3 · Programación 4</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
