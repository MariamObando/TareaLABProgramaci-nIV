<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 — Formulario con localStorage</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
    <h1>Formulario con persistencia en localStorage</h1>
    <p>Los datos sobreviven al refrescar, cerrar la pestaña o el navegador.</p>
</header>

<main>
    <form id="formulario" autocomplete="off">
        <div class="campo">
            <label for="nombre">Ingrese el Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   required minlength="2" maxlength="60">
        </div>
        <div class="campo">
            <label for="correo">Ingrese el Correo electrónico:</label>
            <input type="email" id="correo" name="correo"
                   required maxlength="80">
        </div>
        <div class="acciones">
            <button type="button" id="btn-guardar">Guardar</button>
            <button type="button" id="btn-mostrar">Mostrar</button>
            <button type="button" id="btn-limpiar">Limpiar</button>
        </div>
    </form>

    <section id="resultado" class="resultado">
        <h2>Datos guardados</h2>
        <p id="salida">Aún no hay datos guardados.</p>
    </section>
</main>

<footer>
    <p>Tema 4 · Laboratorio 3 · Programación 4</p>
</footer>

<script src="app.js"></script>
</body>
</html>
